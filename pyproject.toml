[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-transformer"
version = "0.1.7"
description = "End-to-end ontology embedding via fine-tuning sentence transformers with hyperbolic geometry and role-based rotation for existential restrictions."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Hui"},
]
keywords = ["ontology", "embedding", "transformer", "hyperbolic", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "sentence-transformers>=3.0",
    "geoopt>=0.5",
    "deeponto>=0.9",
    "datasets>=2.0",
    "click>=8.0",
    "yacs>=0.1.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-timeout>=2.0"]

[project.scripts]
ont-train = "ont.pipeline:cli"

[tool.setuptools.packages.find]
include = ["ont*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require real ontology files (deselect with '-m \"not integration\"')",
]
